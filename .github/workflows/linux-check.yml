name: Linux check

# The release workflow only runs on a tag, so a Linux-only compile error used to
# surface after the release was already half-published. This job compiles and
# tests the Linux code paths on every push to main, which is roughly the same
# time as the release build's Linux job and catches the mistake before tagging.

on:
  push:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "package.json"
      - "bun.lock*"
      - ".github/workflows/linux-check.yml"
  pull_request:
    paths:
      - "src-tauri/**"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: kiro-linux-check

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev \
            build-essential

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build the frontend (beforeBuildCommand does this for a release)
        run: bun run build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --message-format short

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --message-format short
