name: Release

on:
  # Pushing a version tag is the release trigger, so a release never depends on
  # remembering to press "Run workflow" after the tag exists.
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    strategy:
      # Both platforms contribute to the same release and to the same
      # `latest.json`: tauri-action merges the platforms it finds in the existing
      # manifest, so a second job writing concurrently could drop the other
      # platform's entry. Running them one after another removes that race.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows
          - platform: ubuntu-22.04
            target: linux

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer-app/src-tauri
          cache-on-failure: true
          shared-key: kiro-release-${{ matrix.target }}

      # WebKitGTK, the tray indicator, and the AppImage tooling Tauri links and
      # packs against. Without these the Linux build fails at either build time
      # (pkg-config) or bundle time (linuxdeploy).
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            libfuse2 \
            file \
            build-essential

      - name: Verify version matches tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow must run on a version tag (e.g. v3.8.7)."
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          if [[ $VERSION =~ ^[0-9]+\.[0-9]+$ ]]; then
            VERSION="$VERSION.0"
          fi

          PKG_VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          CONF_VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)")
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          INSTALLER_PKG_VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('installer-app/package.json','utf8')).version)")
          INSTALLER_CONF_VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('installer-app/src-tauri/tauri.conf.json','utf8')).version)")
          INSTALLER_CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' installer-app/src-tauri/Cargo.toml | head -n 1)

          echo "Tag: $VERSION | package.json: $PKG_VERSION | tauri.conf.json: $CONF_VERSION | Cargo.toml: $CARGO_VERSION"
          echo "installer-app -- package.json: $INSTALLER_PKG_VERSION | tauri.conf.json: $INSTALLER_CONF_VERSION | Cargo.toml: $INSTALLER_CARGO_VERSION"

          if [ "$PKG_VERSION" != "$VERSION" ] || [ "$CONF_VERSION" != "$VERSION" ] || [ "$CARGO_VERSION" != "$VERSION" ] || \
             [ "$INSTALLER_PKG_VERSION" != "$VERSION" ] || [ "$INSTALLER_CONF_VERSION" != "$VERSION" ] || [ "$INSTALLER_CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Version files do not match tag $VERSION. Run 'bun run bump $VERSION' and commit before tagging."
            exit 1
          fi

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          COMMIT_COUNT=$(git rev-list --count --no-merges "$RANGE")

          COMPARE=""
          if [ -n "$PREV_TAG" ]; then
            COMPARE=$(printf "\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s" "$GITHUB_REPOSITORY" "$PREV_TAG" "$TAG")
          fi

          HEAD_BODY=$(git log -1 --pretty=format:"%b" --no-merges)
          if [ "$COMMIT_COUNT" -eq 1 ] || printf "%s" "$HEAD_BODY" | grep -qE "^(### |What's New:?$|Improvements:?$|Changed:?$|Bug Fixes:?$)"; then
            BODY=$(git log "$RANGE" -1 --pretty=format:"%b" --no-merges)
            if [ -z "$(printf "%s" "$BODY" | tr -d "[:space:]")" ]; then
              BODY=$(git log "$RANGE" -1 --pretty=format:"%s" --no-merges)
            fi
            BODY=$(printf "%s" "$BODY" | sed -E "s/^(What's New|Improvements|Changed|Bug Fixes|Other):?$/### \1/")
            NOTES=$(printf "%s%s\n" "$BODY" "$COMPARE")
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "$NOTES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS=$(git log "$RANGE" --pretty=format:"%s" --no-merges)

          FEATURES=""
          FIXES=""
          OTHER=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if [[ "$line" =~ ^feat[\(:] ]]; then
              FEATURES+=$(printf "\n- %s" "${line#*: }")
            elif [[ "$line" =~ ^fix[\(:] ]]; then
              FIXES+=$(printf "\n- %s" "${line#*: }")
            else
              OTHER+=$(printf "\n- %s" "$line")
            fi
          done <<< "$COMMITS"

          NOTES=""
          if [ -n "$FEATURES" ]; then
            NOTES+=$(printf "\n\n### What's New%s\n" "$FEATURES")
          fi
          if [ -n "$FIXES" ]; then
            NOTES+=$(printf "\n\n### Bug Fixes%s\n" "$FIXES")
          fi
          if [ -n "$OTHER" ]; then
            NOTES+=$(printf "\n\n### Other%s\n" "$OTHER")
          fi
          NOTES=$(printf "%s%s\n" "$NOTES" "$COMPARE" | sed '/./,$!d')
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Tauri's AppImage bundler caches the `AppRun` launcher and marks it 0770
      # (tauri-apps/tauri#16155). The AppImage runtime presents cached files as
      # owned by whoever mounts the image, so 0770 never bothers the person who
      # built it -- but firejail (and the appimage.github.io catalog test) mounts
      # as root and runs as another user, where `AppRun.wrapped` is then
      # "Permission denied" and the app never starts. The bundler only downloads
      # the launcher when it is missing, so seeding the cache with a 0755 copy
      # makes the packaged file world-executable whatever CLI version is used.
      - name: Make the cached AppImage launcher world-executable
        if: matrix.target == 'linux'
        shell: bash
        run: |
          ARCH="$(uname -m)"
          DIR="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$DIR"
          curl -fsSL --retry 5 --retry-connrefused -o "$DIR/AppRun-$ARCH" \
            "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-$ARCH"
          chmod 755 "$DIR/AppRun-$ARCH"
          ls -l "$DIR/AppRun-$ARCH"

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kiro ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # The CLI merges `tauri.linux.conf.json` automatically on Linux builds,
          # so the same tauri.conf.json stays the single source of truth: the
          # Linux file only swaps `bundle.targets` to deb+appimage and adds the
          # Linux icon set/depends, leaving the Windows NSIS settings untouched.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # tauri-action already published the release at this point, but a signing
      # key that does not match `plugins.updater.pubkey` in tauri.conf.json only
      # shows up as "signature verification failed" on a user's machine. The
      # 24 h auto-install delay in updater.rs means a red build here still gets
      # fixed before anyone receives it.
      - name: Verify the updater signature matches the compiled-in key
        if: matrix.target == 'windows'
        shell: bash
        run: |
          # Absolute paths: `cargo test` switches to the package directory, so a
          # path relative to the repository root would not resolve.
          SIG=$(ls "$PWD"/src-tauri/target/release/bundle/nsis/*.sig | head -n1)
          EXE=$(ls "$PWD"/src-tauri/target/release/bundle/nsis/*-setup.exe | head -n1)
          echo "Verifying $(basename "$SIG") against $(basename "$EXE")"
          KIRO_UPDATE_SIGNATURE="$SIG" KIRO_UPDATE_ARTIFACT="$EXE" \
            cargo test --manifest-path src-tauri/Cargo.toml -- --ignored real_release_signature --nocapture

      # The AppImage is the primary Linux download and the artifact the updater
      # installs in place; the .deb is offered for people who prefer a system
      # package (it installs through dpkg, so it needs root and is not the
      # auto-update path).
      - name: Verify the Linux updater signature
        if: matrix.target == 'linux'
        shell: bash
        run: |
          SIG=$(ls "$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage.sig | head -n1)
          APPIMAGE=$(ls "$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          echo "Verifying $(basename "$SIG") against $(basename "$APPIMAGE")"
          KIRO_UPDATE_SIGNATURE="$SIG" KIRO_UPDATE_ARTIFACT="$APPIMAGE" \
            cargo test --manifest-path src-tauri/Cargo.toml -- --ignored real_release_signature --nocapture

      # Reads the modes out of the image itself. `--appimage-extract` would hide
      # this bug: its runtime creates every directory 0700, so the files look
      # fine to the user who extracted them. A sandbox that mounts as root and
      # runs as another uid (firejail, the AppImage catalog) can only use what
      # is world-readable, and can only execute what is world-executable.
      - name: Verify every file in the AppImage is usable by other users
        if: matrix.target == 'linux'
        shell: bash
        run: |
          APPIMAGE=$(ls "$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          OFFSET=$("$APPIMAGE" --appimage-offset)
          sudo apt-get install -y squashfs-tools >/dev/null
          rm -rf /tmp/kiro-appdir
          unsquashfs -q -o "$OFFSET" -d /tmp/kiro-appdir "$APPIMAGE"
          BAD=$(find /tmp/kiro-appdir \
            \( -type d ! -perm -o+x \) -o \
            \( -type f ! -perm -o+r \) -o \
            \( -type f -perm -u+x ! -perm -o+x \) | head -n 20)
          if [ -n "$BAD" ]; then
            echo "::error::The AppImage contains entries another user cannot use:"
            echo "$BAD"
            ls -l /tmp/kiro-appdir/AppRun* || true
            exit 1
          fi
          ls -l /tmp/kiro-appdir/AppRun*

      # The catalog also starts the image in a sandbox without a network, so a
      # package that only runs for the uid that built it does not count. Boot
      # the real artifact on a virtual X server and wait for the notch to reach
      # the screen, using the same markers as the Linux check smoke test.
      - name: Smoke test the AppImage
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE=$(ls "$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          chmod +x "$APPIMAGE"
          sudo apt-get install -y xvfb dbus-x11 >/dev/null

          export KIRO_WINDOW_DEBUG="$PWD/window-debug.log"
          export KIRO_DEBUG_OPEN=calendar
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1

          timeout 240 xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            dbus-run-session -- "$APPIMAGE" > /tmp/kiro-appimage.log 2>&1 &
          APP_PID=$!

          notch=0
          for _ in $(seq 1 120); do
            if grep -q "notch:" window-debug.log 2>/dev/null; then notch=1; break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then break; fi
            sleep 1
          done

          kill "$APP_PID" 2>/dev/null || true

          echo "--- window log ---"
          cat window-debug.log 2>/dev/null || echo "(no window log)"
          echo "--- app log head ---"
          head -n 60 /tmp/kiro-appimage.log 2>/dev/null || true

          if [ "$notch" != "1" ]; then
            echo "::error::The AppImage never put the notch on screen"
            exit 1
          fi

      - name: Check the Linux downloads and their latest.json entries
        if: matrix.target == 'linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "AppImage: $(basename "$(ls "$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage)")"
          echo "Deb: $(basename "$(ls "$PWD"/src-tauri/target/release/bundle/deb/*.deb)")"

          # Both jobs write latest.json in turn, so assert the file still carries
          # the Windows entry as well as the new Linux ones.
          MANIFEST=$(gh release download "${{ github.ref_name }}" --pattern latest.json --output -)
          echo "$MANIFEST"
          for KEY in windows-x86_64 linux-x86_64; do
            if ! printf "%s" "$MANIFEST" | grep -q "\"$KEY\""; then
              echo "::error::latest.json is missing the $KEY entry after the Linux build."
              exit 1
            fi
          done

      # tauri-action only uploads the NSIS installer (which now offers a
      # "just me" / "all users" choice via installMode: "both" in
      # tauri.conf.json). This adds a second, install-free artifact — the raw
      # compiled exe, zipped — for people who just want to run it without
      # installing anything.
      - name: Package portable build
        if: matrix.target == 'windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd src-tauri/target/release
          7z a "kiro-${VERSION}-portable-windows-x64.zip" kiro.exe
          mv "kiro-${VERSION}-portable-windows-x64.zip" "$GITHUB_WORKSPACE/"

      - name: Upload portable build to release
        if: matrix.target == 'windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${{ github.ref_name }}" "kiro-${VERSION}-portable-windows-x64.zip" --clobber

      # The NSIS installer above exists only to feed the silent auto-updater
      # (tauri-plugin-updater only recognizes NSIS/MSI artifacts). This custom
      # installer-app/ build is the actual thing people download and run —
      # see installer-app/README.md for why the two are separate.
      - name: Package installer payload
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "src-tauri/target/release/kiro.exe" -DestinationPath "installer-app/src-tauri/payload.zip" -Force

      - name: Install installer-app dependencies
        if: matrix.target == 'windows'
        working-directory: installer-app
        run: npm ci --no-audit --no-fund

      - name: Build custom installer
        if: matrix.target == 'windows'
        working-directory: installer-app
        run: npm run tauri build -- --no-bundle

      - name: Rename and upload custom installer
        if: matrix.target == 'windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="Kiro-Setup-${VERSION}.exe"
          cp "installer-app/src-tauri/target/release/kiro-installer.exe" "$OUT"
          gh release upload "${{ github.ref_name }}" "$OUT" --clobber
